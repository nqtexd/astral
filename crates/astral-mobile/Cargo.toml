[package]
name = "astral-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "astral-touch-preview"
path = "src/main.rs"

[dependencies]
astral-core.workspace = true
astral-storage.workspace = true
astral-render.workspace = true
anyhow.workspace = true
serde_json.workspace = true
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["android-native-activity"] }
android-activity = { version = "=0.6.1", features = ["native-activity"] }
jni = "0.21"
android_logger = "0.15"
log = "0.4"

[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios"))))'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["x11", "wayland"] }

[dev-dependencies]
tempfile = "3"
