name: Astral platform development checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stage encoder
        run: |
          python -m pip install imageio-ffmpeg==0.6.0
          python scripts/stage-video-encoder.py
      - name: Shared document and touch checks
        run: cargo test -p astral-core -p astral-storage -p astral-render -p astral-mobile --locked
      - name: Native desktop bridge checks
        run: cargo test -p astral --lib ipc::tests --locked
      - name: Build desktop
        run: cargo build -p astral --release --locked
      - name: Real headless MCP acceptance
        env:
          ASTRAL_BINARY: ${{ github.workspace }}/target/release/astral
        run: node scripts/check-astral-director.mjs
      - name: Package development application
        run: python scripts/package-astral-macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: astral-macos-development-${{ matrix.runner }}
          path: |
            release/*macos-*.tar.gz
            artifacts/astral-010/ACCEPTANCE.json
  apple-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project generator
        run: brew install xcodegen
      - name: Build unsigned simulator application
        run: python scripts/build-astral-apple.py
      - uses: actions/upload-artifact@v4
        with:
          name: astral-apple-simulator-development
          path: |
            build/apple/DerivedData/Build/Products/Debug-iphonesimulator/AstralPreview.app
            build/apple/build-report.json
