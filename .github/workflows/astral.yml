name: Astral native checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'crates/**', 'scripts/*astral*', 'tests/astral*.mjs', 'tests/test_astral*.py', 'tests/helpers/**', 'vendor/psd/**', '.github/workflows/astral.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'crates/**', 'scripts/*astral*', 'tests/astral*.mjs', 'tests/test_astral*.py', 'tests/helpers/**', 'vendor/psd/**', '.github/workflows/astral.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage the pinned offline encoder
        run: |
          python -m pip install imageio-ffmpeg==0.6.0
          python scripts/stage-video-encoder.py
      - name: Stage pinned offline speech and parser runtimes
        run: |
          python scripts/stage-astral-speech.py
          python scripts/stage-astral-node.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Legacy source evaluation regression
        run: node --test tests/astral-legacy-evaluation.test.mjs tests/astral-psd.test.mjs
      - name: Production gate checker regression
        run: python -m unittest discover -s tests -p test_astral_readiness.py
      - name: Strict lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build -p astral --locked
      - name: Feedback and project-management acceptance
        env:
          ASTRAL_BINARY: ${{ github.workspace }}/target/debug/astral.exe
        run: node scripts/check-astral-feedback.mjs
      - name: External MCP acceptance
        run: node scripts/smoke-astral.mjs
      - name: Native artwork MCP acceptance (PNG without encoder)
        env:
          ASTRAL_BINARY: ${{ github.workspace }}/target/debug/astral.exe
        run: node scripts/check-astral-artwork.mjs
      - name: Production candidate workflows
        env:
          ASTRAL_BINARY: ${{ github.workspace }}/target/debug/astral.exe
        run: node scripts/check-astral-production.mjs
      - name: MCP profile contracts
        run: node scripts/smoke-astral-profiles.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: astral-agent-acceptance
          path: artifacts/astral-smoke
