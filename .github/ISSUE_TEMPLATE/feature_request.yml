name: Feature request
description: Suggest a concrete animation workflow improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What workflow is difficult?
      description: Describe the task, its current friction and the outcome you need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Include an example and any manual overrides or compatibility requirements.
